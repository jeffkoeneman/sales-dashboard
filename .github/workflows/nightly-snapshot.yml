name: Nightly LoS Snapshot

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC = midnight MT
  workflow_dispatch:       # allows manual trigger from GitHub Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger snapshot
        run: |
          curl -s -X GET "https://sales-dashboard-gamma-blond.vercel.app/api/snapshot" \
            -H "Content-Type: application/json"
